{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div class="mb-6">
  <h1 class="text-xl font-semibold text-gray-900 dark:text-white">{{ title }}</h1>
  {% if subtitle %}
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">{{ subtitle }}</p>
  {% endif %}
</div>

<form method="post">
  {% csrf_token %}

  <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 mb-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-medium text-gray-700 dark:text-gray-200">
        Yuklab olish uchun maydonlarni tanlang
      </h2>
      <div class="flex gap-3 text-sm">
        <button type="button" onclick="toggleAll(true)"
          class="text-blue-600 hover:underline dark:text-blue-400">
          Barchasini tanlash
        </button>
        <span class="text-gray-300">|</span>
        <button type="button" onclick="toggleAll(false)"
          class="text-blue-600 hover:underline dark:text-blue-400">
          Barchasini bekor qilish
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
      {% for field in fields %}
      <label class="flex items-center gap-2 p-2 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer">
        <input
          type="checkbox"
          name="fields"
          value="{{ field.name }}"
          checked
          class="field-checkbox w-4 h-4 text-blue-600 rounded border-gray-300 dark:border-gray-600"
        >
        <span class="text-sm text-gray-700 dark:text-gray-200">
          {{ field.verbose }}
        </span>
        <span class="text-xs text-gray-400 dark:text-gray-500 ml-auto font-mono">
          {{ field.name }}
        </span>
      </label>
      {% endfor %}
    </div>
  </div>

  <div class="flex items-center gap-4">
    <button type="submit"
      class="inline-flex items-center gap-2 px-5 py-2.5 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg transition-colors">
      Excel yuklab olish (.xlsx)
    </button>
    <a href="../"
      class="text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
      Bekor qilish
    </a>
  </div>
</form>

<script>
  function toggleAll(checked) {
    document.querySelectorAll('.field-checkbox').forEach(cb => cb.checked = checked);
  }
</script>
{% endblock %}
